schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  本仓库是 Test Privateer 的 23 个 Agent Skills，不是业务应用。
  开始或恢复变更时读取 openspec/project.md 和相关当前 specs。
  skills/ 是发布源；OpenSpec 只管理本仓库，不强制使用方采用本框架。
  保留功能测试、单元测试和证据边界；有限评测不能证明普遍稳定。

rules:
  proposal:
    - 写清原问题、范围与非目标；复用已有能力，避免为单个案例加规则。
  specs:
    - 描述可观察行为；每项 Requirement 有 SHALL/MUST 及 Scenario，保留错误与正常边界。
  design:
    - 说明最小作用点、兼容保护与验证方式；不重复抄写 specs。
  tasks:
    - 任务关联当前 delta；仅在实际完成后勾选，受阻或未授权部分保持可见。

operations:
  archive:
    guidance:
      - 按原请求核对完成范围，记录简短验证结论及限制；不提交原始评测记录。
      - 历史回填注明来源提交和迁移日期，不补造当时的审批、执行或验证证据。
